name: Verify Developer ID credentials

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signing:
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      MSGBLAST_APPLE_TEAM_ID: ${{ vars.MSGBLAST_APPLE_TEAM_ID }}
      MSGBLAST_DEVELOPER_ID_IDENTITY: ${{ vars.MSGBLAST_DEVELOPER_ID_IDENTITY }}
      MSGBLAST_NOTARY_KEY_ID: ${{ vars.MSGBLAST_NOTARY_KEY_ID }}
      MSGBLAST_NOTARY_ISSUER_ID: ${{ vars.MSGBLAST_NOTARY_ISSUER_ID }}
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Require default-branch verification
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH"

      - name: Install temporary signing credentials
        env:
          MSGBLAST_DEVELOPER_ID_P12: ${{ secrets.MSGBLAST_DEVELOPER_ID_P12 }}
          MSGBLAST_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MSGBLAST_DEVELOPER_ID_P12_PASSWORD }}
          MSGBLAST_NOTARY_API_KEY: ${{ secrets.MSGBLAST_NOTARY_API_KEY }}
        run: python3 scripts/ci_signing.py setup

      - name: Verify private-key signing and notarization profile
        run: |
          probe_directory=$(dirname "$MSGBLAST_NOTARY_KEYCHAIN")
          printf 'int main(void) { return 0; }\n' > "$probe_directory/probe.c"
          xcrun clang "$probe_directory/probe.c" -o "$probe_directory/probe"
          codesign --force --sign "$MSGBLAST_DEVELOPER_ID_IDENTITY" --timestamp --options runtime "$probe_directory/probe"
          codesign --verify --strict "$probe_directory/probe"
          codesign -dv --verbose=4 "$probe_directory/probe" 2> "$probe_directory/signature.txt"
          python3 - <<'PY'
          import os
          from pathlib import Path
          signature = (Path(os.environ['MSGBLAST_NOTARY_KEYCHAIN']).parent / 'signature.txt').read_text()
          assert 'Authority=' + os.environ['MSGBLAST_DEVELOPER_ID_IDENTITY'] in signature
          assert 'TeamIdentifier=' + os.environ['MSGBLAST_APPLE_TEAM_ID'] in signature
          print('Developer ID signing authority and team verified on an isolated executable probe.')
          PY
          xcrun notarytool history --keychain-profile "$MSGBLAST_NOTARY_PROFILE" \
            --keychain "$MSGBLAST_NOTARY_KEYCHAIN" --output-format json > "$probe_directory/notary-history.json"
          echo 'Temporary-keychain notarization authentication verified.'

      - name: Remove temporary credentials
        if: always()
        run: python3 scripts/ci_signing.py cleanup
